<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo Rajesh Kumar - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px 30px;
            text-align: center;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 40px 30px;
        }

        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 24px;
            gap: 16px;
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            line-height: 1.4;
        }

        .contact-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .contact-value {
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .contact-value a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-value a:hover {
            color: #764ba2;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }

        .qr-section {
            text-align: center;
        }

        .qr-label {
            font-size: 14px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            display: block;
        }

        .qr-image {
            width: 100%;
            max-width: 260px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        .contact-form {
            margin-bottom: 30px;
            padding: 24px;
            background: #f8f9ff;
            border-radius: 18px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .form-label {
            font-size: 14px;
            color: #333;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-fields {
            display: grid;
            gap: 14px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dde2ef;
            border-radius: 14px;
            background: #fff;
            font-size: 15px;
            color: #333;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .form-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(118, 75, 162, 0.2);
        }

        .form-note {
            font-size: 13px;
            color: #777;
            margin-top: 12px;
            line-height: 1.5;
        }

        .footer {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px 20px;
            }

            .name {
                font-size: 24px;
            }

            .content {
                padding: 30px 20px;
            }

            .contact-item {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
